<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Impulso</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Impulso: organiza tu día, enfócate sin distracciones y mantén la racha. Para estudiantes y profesionales.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra lateral fija + vista central con tarjetas; en móvil, barra superior y pestañas inferiores. */
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --surface-2:#F3F6F5; --line:#D8E0DD; --line-2:#C2CEC9;
  --ink:#10252A; --ink-2:#44585C; --ink-3:#5A6D71;
  --accent:#0E7C6B; --accent-ink:#FFFFFF; --accent-soft:#D6EEE7; --accent-strong:#0A5E51;
  --sun:#E8A817; --sun-soft:#FBEFC9; --sun-ink:#6A4700;
  --deep:#0B3A3A; --deep-2:#12514E; --deep-ink:#EAF6F3; --deep-ink-2:#A8CEC7; --deep-accent:#5EE0C2; --deep-line:rgba(255,255,255,.16); --deep-glass:rgba(255,255,255,.09);
  --study:#3559C4; --study-soft:#E4EAFA; --work:#A8510F; --work-soft:#F8E9DA; --personal:#A8346A; --personal-soft:#F7E2EC;
  --hi:#B73535; --hi-soft:#F9E2E2; --mid:#8A5F00; --mid-soft:#FBEFC9; --lo:#4B6065; --lo-soft:#E5ECEA;
  --bar:#9ED8C9; --h0:#E6ECEA; --h1:#CDEBE3; --h2:#93D6C5; --h3:#3FB39A; --h4:#0E7C6B;
  --shadow:0 1px 2px rgba(16,37,42,.06),0 10px 26px -14px rgba(16,37,42,.22);
  --radius:18px;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#091416; --surface:#112428; --surface-2:#153035; --line:#23424A; --line-2:#325A63;
    --ink:#E7F2F0; --ink-2:#A6BDBC; --ink-3:#88A2A2;
    --accent:#3FD0B0; --accent-ink:#05211B; --accent-soft:#14403A; --accent-strong:#7BE8CF;
    --sun:#F6C453; --sun-soft:#3A2F12; --sun-ink:#F6C453;
    --deep:#0E4443; --deep-2:#16605B; --deep-ink:#EAF6F3; --deep-ink-2:#A8CEC7; --deep-accent:#5EE0C2; --deep-line:rgba(255,255,255,.16); --deep-glass:rgba(255,255,255,.09);
    --study:#8BABFF; --study-soft:#1B2B52; --work:#F2A765; --work-soft:#3B2A18; --personal:#F292BA; --personal-soft:#40202F;
    --hi:#FF8F8F; --hi-soft:#431F23; --mid:#F6C453; --mid-soft:#3A2F12; --lo:#9DB4B3; --lo-soft:#1D3338;
    --bar:#1F6A5D; --h0:#173137; --h1:#17403B; --h2:#1F6A5D; --h3:#2FA58C; --h4:#5EE0C2;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px -14px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#091416; --surface:#112428; --surface-2:#153035; --line:#23424A; --line-2:#325A63;
  --ink:#E7F2F0; --ink-2:#A6BDBC; --ink-3:#88A2A2;
  --accent:#3FD0B0; --accent-ink:#05211B; --accent-soft:#14403A; --accent-strong:#7BE8CF;
  --sun:#F6C453; --sun-soft:#3A2F12; --sun-ink:#F6C453;
  --deep:#0E4443; --deep-2:#16605B; --deep-ink:#EAF6F3; --deep-ink-2:#A8CEC7; --deep-accent:#5EE0C2; --deep-line:rgba(255,255,255,.16); --deep-glass:rgba(255,255,255,.09);
  --study:#8BABFF; --study-soft:#1B2B52; --work:#F2A765; --work-soft:#3B2A18; --personal:#F292BA; --personal-soft:#40202F;
  --hi:#FF8F8F; --hi-soft:#431F23; --mid:#F6C453; --mid-soft:#3A2F12; --lo:#9DB4B3; --lo-soft:#1D3338;
  --bar:#1F6A5D; --h0:#173137; --h1:#17403B; --h2:#1F6A5D; --h3:#2FA58C; --h4:#5EE0C2;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
h1,h2,h3,p{margin:0}
ul{margin:0;padding:0;list-style:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.fill{fill:currentColor;stroke:none}
.num{font-variant-numeric:tabular-nums}

/* ---------- Estructura ---------- */
.app{max-width:1340px;margin:0 auto;display:grid;grid-template-columns:260px minmax(0,1fr);gap:32px;align-items:start}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;padding-block:22px;display:flex;flex-direction:column;gap:20px;scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.02em}
.brand-mark{width:34px;height:34px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand-mark .ic{width:20px;height:20px;stroke-width:2.6}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:var(--ink-2);text-decoration:none;font-weight:600}
.nav a:hover{background:var(--surface);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.nav a[aria-current="page"] .ic{color:var(--accent)}
.nav .dot{margin-left:auto;font:500 12px var(--f-mono);color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:1px 8px}
.side-block{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);gap:2px;max-width:100%}
.seg button{padding:7px 12px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.seg.full{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.profile{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line)}
.profile-top{display:flex;align-items:center;gap:12px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--sun);color:#3a2800;display:grid;place-items:center;font:700 18px var(--f-display);flex:none}
.name-input{width:100%;min-width:0;border:0;border-bottom:1px dashed transparent;background:transparent;font:700 16px var(--f-display);padding:2px 0}
.name-input:hover,.name-input:focus{border-bottom-color:var(--line-2)}
.lvl{font-size:13px;color:var(--ink-2)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--sun);transition:width .5s cubic-bezier(.3,.7,.2,1)}
.bar.accent>i{background:var(--accent)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;font-size:12.5px;color:var(--ink-3)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.link-btn{font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px;padding:6px 8px;margin-left:-8px;border-radius:8px}
.link-btn:hover{color:var(--ink);background:var(--surface)}

.topbar,.tabs{display:none}
.main{min-width:0;padding-block:26px 56px;display:flex;flex-direction:column;gap:20px}
.main.enter>*{animation:rise .32s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page-head{display:flex;flex-direction:column;gap:4px}
.page-head h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,4vw,38px);letter-spacing:-.025em;line-height:1.08;text-wrap:balance}
.page-head p{color:var(--ink-2);max-width:62ch}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.card-h h2{font-family:var(--f-display);font-weight:650;font-size:20px;letter-spacing:-.015em}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.grid-2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:11px 18px;border-radius:13px;font-weight:700;background:var(--accent);color:var(--accent-ink);transition:transform .12s,filter .15s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.97)}
.btn.sun{background:var(--sun);color:#352400}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.deep-ghost{background:var(--deep-glass);color:var(--deep-ink);border:1px solid var(--deep-line)}
.btn.small{padding:8px 13px;font-size:13.5px;border-radius:11px}
.icon-btn{width:36px;height:36px;border-radius:10px;display:inline-grid;place-items:center;color:var(--ink-3);flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn.danger:hover{color:var(--hi);background:var(--hi-soft)}

/* ---------- Héroe de Hoy ---------- */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:26px;color:var(--deep-ink);
  background:radial-gradient(120% 140% at 100% 0%,rgba(94,224,194,.22),transparent 55%),linear-gradient(135deg,var(--deep),var(--deep-2));
  display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,.95fr);gap:26px;align-items:center;box-shadow:var(--shadow)}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,3.4vw,36px);letter-spacing:-.025em;line-height:1.08;text-wrap:balance}
.hero .date{color:var(--deep-ink-2);font-weight:600;margin-bottom:6px}
.hero .lead{color:var(--deep-ink-2);margin-top:10px;max-width:46ch}
.hero .lead b{color:var(--deep-ink);font-weight:700}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:var(--deep-line);stroke-width:11}
.ring .val{fill:none;stroke:var(--deep-accent);stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.3,.7,.2,1)}
.ring-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-c b{font:700 30px var(--f-display);line-height:1}
.ring-c span{font-size:12px;color:var(--deep-ink-2);font-weight:600}
.next{background:var(--deep-glass);border:1px solid var(--deep-line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.next .eyebrow{color:var(--deep-accent)}
.next strong{font:650 18px/1.25 var(--f-display);letter-spacing:-.01em;overflow-wrap:anywhere}
.next .why{font-size:13.5px;color:var(--deep-ink-2)}

/* ---------- Tareas ---------- */
.capture{display:flex;gap:10px;margin-bottom:6px}
.capture input,.field input,.field select,.inline-form input{flex:1;min-width:0;padding:12px 14px;border-radius:13px;border:1px solid var(--line-2);background:var(--surface-2);outline-offset:1px}
.capture input::placeholder,.inline-form input::placeholder{color:var(--ink-3)}
.hint{font-size:12.5px;color:var(--ink-3);margin-bottom:10px}
.hint code{font-family:var(--f-mono);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:0 5px}
.tasks{display:flex;flex-direction:column}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 4px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.check{width:26px;height:26px;border-radius:9px;border:2px solid var(--line-2);display:grid;place-items:center;color:transparent;transition:all .18s;flex:none;background:var(--surface)}
.check:hover{border-color:var(--accent)}
.check[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check .ic{width:15px;height:15px;stroke-width:3.2}
.task-body{display:flex;flex-direction:column;gap:5px;min-width:0}
.task-title{font-weight:600;overflow-wrap:anywhere}
.is-done .task-title{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1.5px}
.task-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-weight:600;font-size:12px;line-height:1.5}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor}
.cat-study{background:var(--study-soft);color:var(--study)}
.cat-work{background:var(--work-soft);color:var(--work)}
.cat-personal{background:var(--personal-soft);color:var(--personal)}
.prio-high{background:var(--hi-soft);color:var(--hi)}
.prio-med{background:var(--mid-soft);color:var(--mid)}
.prio-low{background:var(--lo-soft);color:var(--lo)}
.chip.carried{background:var(--sun-soft);color:var(--sun-ink)}
.mins{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.task-actions{display:flex;gap:2px}
.empty{padding:26px 10px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:6px}
.empty b{font:650 17px var(--f-display);color:var(--ink)}

/* ---------- Tarjetas laterales ---------- */
.quote{background:var(--sun-soft);border-color:transparent;box-shadow:none}
.quote blockquote{margin:0;font:600 19px/1.35 var(--f-display);letter-spacing:-.01em;color:var(--ink);text-wrap:pretty}
.quote cite{display:block;margin-top:10px;font-style:normal;font-size:13px;font-weight:600;color:var(--sun-ink)}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.mini-stat{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:11px 12px;display:flex;flex-direction:column;gap:2px}
.mini-stat b{font:700 22px var(--f-display);display:flex;align-items:center;gap:7px;letter-spacing:-.02em}
.mini-stat span{font-size:12.5px;color:var(--ink-2)}
.flame{color:var(--work)}
.habit-quick{display:flex;flex-direction:column;gap:2px}
.habit-quick button{display:flex;align-items:center;gap:12px;text-align:left;padding:9px 4px;border-radius:12px;width:100%;font-weight:600}
.habit-quick button:hover{background:var(--surface-2)}
.habit-quick .check{width:24px;height:24px}
.intent{width:100%;min-width:0;padding:12px 14px;border-radius:13px;border:1px solid var(--line-2);background:var(--surface-2);resize:none;font:600 16px/1.4 var(--f-display)}
.intent::placeholder{color:var(--ink-3);font-weight:500}

/* ---------- Enfoque ---------- */
.focus-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}
.focus-card{border-radius:26px;padding:26px;color:var(--deep-ink);display:flex;flex-direction:column;align-items:center;gap:20px;
  background:radial-gradient(110% 90% at 50% 0%,rgba(94,224,194,.2),transparent 60%),linear-gradient(160deg,var(--deep),var(--deep-2));box-shadow:var(--shadow)}
.focus-card .seg{background:rgba(0,0,0,.2);border-color:var(--deep-line)}
.focus-card .seg button{color:var(--deep-ink-2)}
.focus-card .seg button[aria-selected="true"]{background:var(--deep-ink);color:var(--deep)}
.ring-xl{position:relative;width:min(300px,78vw);aspect-ratio:1}
.ring-xl svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-xl .trk{fill:none;stroke:var(--deep-line);stroke-width:10}
.ring-xl .val{fill:none;stroke:var(--deep-accent);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .35s linear}
.ring-xl.is-break .val{stroke:var(--sun)}
.ring-xl-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tm-time{font:500 clamp(54px,14vw,72px)/1 var(--f-mono);letter-spacing:-.04em}
.tm-kind{font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:12.5px;color:var(--deep-accent)}
.tm-round{font-size:13px;color:var(--deep-ink-2)}
.tm-controls{display:flex;align-items:center;gap:16px}
.round-btn{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--deep-glass);border:1px solid var(--deep-line);color:var(--deep-ink)}
.round-btn:hover{background:rgba(255,255,255,.16)}
.main-btn{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:var(--sun);color:#352400;box-shadow:0 12px 30px -10px rgba(246,196,83,.6);transition:transform .12s}
.main-btn:active{transform:scale(.94)}
.main-btn .ic{width:34px;height:34px}
.focus-fields{width:100%;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;width:100%}
.field label{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.focus-card .field label{color:var(--deep-ink-2)}
.focus-card .field select{background:rgba(0,0,0,.22);border-color:var(--deep-line);color:var(--deep-ink)}
.focus-card .field select option{color:#10252A}
.presets{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.preset{padding:7px 14px;border-radius:99px;border:1px solid var(--deep-line);color:var(--deep-ink-2);font-weight:600;font-size:13.5px}
.preset[aria-pressed="true"]{background:var(--deep-ink);color:var(--deep);border-color:transparent}
.focus-links{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.distract{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.distract button{padding:7px 13px;border-radius:99px;background:var(--deep-glass);border:1px solid var(--deep-line);font-weight:600;font-size:13.5px;color:var(--deep-ink)}
.distract button:hover{background:rgba(255,255,255,.18)}
.ritual li{display:flex}
.ritual button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 4px;border-radius:12px;font-weight:600}
.ritual button:hover{background:var(--surface-2)}
.ritual .check{width:24px;height:24px}
.log-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.log-item:first-child{border-top:0}
.log-item span:first-child{min-width:0;overflow-wrap:anywhere;font-weight:600}

/* ---------- Hábitos ---------- */
.habit-head,.habit-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center}
.habit-head{padding:0 0 8px;font-size:12px;font-weight:700;color:var(--ink-3)}
.habit-row{padding:14px 0;border-top:1px solid var(--line)}
.habit-name{font-weight:700;display:flex;flex-direction:column;gap:2px;min-width:0;overflow-wrap:anywhere}
.habit-name span{font-weight:500;font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.days{display:grid;grid-template-columns:repeat(7,34px);gap:6px}
.days.head span{text-align:center;text-transform:uppercase;letter-spacing:.05em}
.days.head span.today{color:var(--accent)}
.day{width:34px;height:34px;border-radius:11px;border:2px solid var(--line-2);display:grid;place-items:center;color:transparent;background:var(--surface);transition:all .15s}
.day:hover{border-color:var(--accent)}
.day.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day.today:not(.on){border-color:var(--accent);border-style:dashed}
.day .ic{width:16px;height:16px;stroke-width:3.2}
.habit-end{display:flex;align-items:center}
.inline-form{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.inline-form input[type="date"]{flex:0 1 170px}

/* ---------- Metas ---------- */
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:20px}
.goal{display:flex;flex-direction:column;gap:14px}
.goal-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.goal h3{font:650 19px/1.25 var(--f-display);letter-spacing:-.015em;overflow-wrap:anywhere}
.goal .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:6px}
.pct{font:700 26px var(--f-display);letter-spacing:-.03em;color:var(--accent)}
.steps{display:flex;flex-direction:column}
.step{display:flex;align-items:center;gap:11px;padding:8px 2px;text-align:left;width:100%;border-radius:10px;font-weight:500}
.step:hover{background:var(--surface-2)}
.step .check{width:22px;height:22px;border-radius:7px}
.step .check .ic{width:13px;height:13px}
.step.is-done span{color:var(--ink-3);text-decoration:line-through}
.step.next-step span{font-weight:700}
.step.next-step .tag{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);flex:none}
.goal-done{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--accent)}

/* ---------- Progreso ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{display:flex;flex-direction:column;gap:4px;padding:16px 18px}
.kpi .label{font-size:13px;font-weight:600;color:var(--ink-2)}
.kpi b{font:700 30px/1.1 var(--f-display);letter-spacing:-.03em}
.kpi .sub{font-size:12.5px;color:var(--ink-2)}
.up{color:var(--accent);font-weight:700}
.down{color:var(--hi);font-weight:700}
.chart{width:100%;height:auto;display:block}
.chart .ax{fill:var(--ink-3);font:500 11.5px var(--f-body)}
.chart .ax.today{fill:var(--ink);font-weight:700}
.chart .val-l{fill:var(--ink-2);font:600 11.5px var(--f-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .goal-l{stroke:var(--sun);stroke-width:2;stroke-dasharray:6 5}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.legend i.dash{height:0;width:18px;border-top:2px dashed var(--sun);border-radius:0}
.heat-wrap{display:flex;gap:10px;align-items:flex-start}
.heat-days{display:grid;grid-template-rows:repeat(7,1fr);gap:6px;font-size:11px;color:var(--ink-3);padding-top:0}
.heat-days span{height:26px;display:flex;align-items:center}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,26px);grid-auto-columns:minmax(26px,1fr);gap:6px;flex:1;min-width:0}
.cell{border-radius:7px;background:var(--h0)}
.cell.l1{background:var(--h1)}.cell.l2{background:var(--h2)}.cell.l3{background:var(--h3)}.cell.l4{background:var(--h4)}
.cell.future{background:transparent;border:1px dashed var(--line)}
.cell.today{outline:2px solid var(--ink);outline-offset:1px}
.scale{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-3);margin-top:10px}
.scale .cell{width:16px;height:16px;border-radius:5px}
.split{display:flex;height:16px;border-radius:99px;overflow:hidden;gap:3px;margin:6px 0 14px}
.split i{display:block;height:100%}
.split .cat-study,.dot-study{background:var(--study)}
.split .cat-work,.dot-work{background:var(--work)}
.split .cat-personal,.dot-personal{background:var(--personal)}
.dist-list{display:flex;flex-direction:column;gap:10px}
.dist-row{display:grid;grid-template-columns:120px minmax(0,1fr) 28px;gap:12px;align-items:center;font-size:14px;font-weight:600}
.dist-row .bar{height:10px}
.dist-row .bar i{background:var(--hi)}
.insight{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--sun-soft);color:var(--ink);font-size:14px}
.insight b{color:var(--sun-ink)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.badge{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface-2)}
.badge .seal{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--sun);color:#352400}
.badge .seal .ic{width:22px;height:22px}
.badge b{display:block;font-weight:700;font-size:14.5px;line-height:1.25}
.badge span{font-size:12.5px;color:var(--ink-2)}
.badge.locked{background:transparent;border-style:dashed}
.badge.locked .seal{background:var(--lo-soft);color:var(--ink-3)}
.badge.locked b{color:var(--ink-2)}

/* ---------- Flotantes ---------- */
#mini{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;display:inline-flex;align-items:center;gap:9px;padding:11px 16px;border-radius:99px;background:var(--deep);color:var(--deep-ink);font:500 16px var(--f-mono);box-shadow:0 14px 34px -10px rgba(0,0,0,.5);border:1px solid var(--deep-line)}
#mini[hidden]{display:none}
#mini .ic{color:var(--sun)}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;flex-direction:column-reverse;gap:8px;align-items:center;pointer-events:none;width:min(440px,calc(100vw - 32px))}
.toast{pointer-events:auto;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.45);animation:rise .25s ease-out;display:flex;gap:10px;align-items:center}
.toast .ic{color:var(--sun);flex:none}
.toast.badge-t{background:var(--sun);color:#352400}
.toast.badge-t .ic{color:#352400}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
  .topbar .brand{font-size:22px}
  .topbar .brand-mark{width:30px;height:30px;border-radius:10px}
  .topbar .seg button{padding:6px 10px;font-size:13px}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;color:var(--ink-3);text-decoration:none;font-size:11.5px;font-weight:600}
  .tabs a .ic{width:22px;height:22px}
  .tabs a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
  .main{padding-block:14px 110px}
  #mini{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  #toasts{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .grid-2,.focus-grid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .hero{grid-template-columns:minmax(0,1fr);padding:22px;gap:18px;justify-items:start}
  .hero .ring{width:112px;height:112px}
  .card{padding:16px}
  .habit-head{display:none}
  .habit-row{grid-template-columns:minmax(0,1fr) auto;row-gap:10px}
  .habit-row .days{grid-column:1 / -1;grid-row:2;grid-template-columns:repeat(7,minmax(0,1fr))}
  .habit-row .day{width:100%}
  .dist-row{grid-template-columns:96px minmax(0,1fr) 24px;font-size:13px}
  .kpi b{font-size:26px}
  .capture{flex-direction:column}
  .heat{grid-auto-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

<script>
(function(){
'use strict';

/* ======================= Utilidades ======================= */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const dkey = (d = new Date()) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const dateOf = k => new Date(k + 'T12:00:00');
const keyOffset = n => { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() + n); return dkey(d); };
const dayDiff = (a, b) => Math.round((dateOf(b) - dateOf(a)) / 864e5);
const uid = () => Math.random().toString(36).slice(2, 9);
const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);
const fmtMin = m => { m = Math.round(m); const h = Math.floor(m / 60), r = m % 60; return h ? (r ? h + ' h ' + r + ' min' : h + ' h') : m + ' min'; };
const mmss = s => pad(Math.floor(s / 60)) + ':' + pad(s % 60);
const ic = (n, cls) => '<svg class="ic ' + (cls || '') + '" aria-hidden="true"><use href="#i-' + n + '"/></svg>';
const reduceMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const dowShort = k => ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'][dateOf(k).getDay()];
const dowLetter = k => ['D', 'L', 'M', 'X', 'J', 'V', 'S'][dateOf(k).getDay()];
const fmtLong = new Intl.DateTimeFormat('es-ES', {weekday: 'long', day: 'numeric', month: 'long'});

/* ======================= Datos fijos ======================= */
const CATS = {study: 'Estudio', work: 'Trabajo', personal: 'Personal'};
const PRIOS = {high: {n: 'Alta', w: 3}, med: {n: 'Media', w: 2}, low: {n: 'Baja', w: 1}};
const PRESETS = {classic: {n: 'Clásico 25/5', f: 25, s: 5, l: 15}, deep: {n: 'Profundo 50/10', f: 50, s: 10, l: 20}, sprint: {n: 'Sprint 15/3', f: 15, s: 3, l: 10}};
const CAUSES = ['Redes sociales', 'Mensajes', 'Cansancio', 'Ruido', 'Pensamientos'];
const CAUSE_TIPS = {
  'Redes sociales': 'Deja el móvil boca abajo y fuera del alcance durante cada bloque.',
  'Mensajes': 'Silencia las notificaciones y responde en un bloque fijo al terminar.',

  'Ruido': 'Usa auriculares con ruido blanco o busca una sala tranquila.',
  'Pensamientos': 'Apunta la idea en una nota rápida y vuelve a la tarea. Luego la revisas.'
};
const LEVELS = ['Semilla', 'Brote', 'Constante', 'Enfocado', 'Imparable', 'Maestro del tiempo'];
const QUOTES = [
  ['No es que tengamos poco tiempo, sino que perdemos mucho.', 'Séneca'],
  ['¿Amas la vida? Entonces no malgastes el tiempo, porque de eso está hecha la vida.', 'Benjamin Franklin'],
  ['Somos lo que hacemos repetidamente. La excelencia es un hábito, no un acto.', 'Will Durant'],
  ['Empieza donde estás. Usa lo que tienes. Haz lo que puedas.', 'Arthur Ashe'],
  ['Lo que haces cada día importa más que lo que haces de vez en cuando.', 'Gretchen Rubin'],
  ['Empieza con cinco minutos. El impulso hace el resto.', 'Principio Impulso'],
  ['Una tarea a la vez, bien hecha, vale más que diez a medias.', 'Principio Impulso'],
  ['La disciplina es el puente entre las metas y los logros.', 'Jim Rohn'],
  ['Si te lleva menos de dos minutos, hazlo ahora mismo.', 'Regla de los dos minutos'],
  ['El progreso pequeño de hoy es la ventaja enorme de mañana.', 'Principio Impulso']
];
const BADGES = [
  {id: 'first', n: 'Primer enfoque', d: 'Completa una sesión de enfoque', i: 'timer', ok: (P, x) => P.sessions.length >= 1},
  {id: 'streak3', n: 'Racha de 3 días', d: 'Tres días seguidos con actividad', i: 'flame', ok: (P, x) => x.best >= 3},
  {id: 'streak7', n: 'Semana entera', d: 'Siete días seguidos con actividad', i: 'flame', ok: (P, x) => x.best >= 7},
  {id: 'perfect', n: 'Día perfecto', d: 'Termina todas las tareas de hoy', i: 'check', ok: (P, x) => x.todayTotal > 0 && x.todayDone === x.todayTotal},
  {id: 'deep', n: 'Enfoque profundo', d: 'Una sesión de 50 min o más', i: 'bolt', ok: (P, x) => P.sessions.some(s => s.min >= 50)},
  {id: 'focus5h', n: '5 horas enfocado', d: 'Acumula 5 h de enfoque', i: 'clock', ok: (P, x) => x.focusTotal >= 300},
  {id: 'habit7', n: 'Hábito de acero', d: 'Un hábito 7 días seguidos', i: 'repeat', ok: (P, x) => x.habitBest >= 7},
  {id: 'goal', n: 'Meta cumplida', d: 'Completa todos los pasos de una meta', i: 'flag', ok: (P, x) => P.goals.some(g => g.steps.length && g.steps.every(s => s.done))},
  {id: 'lvl5', n: 'Nivel 5', d: 'Alcanza el nivel Imparable', i: 'award', ok: (P, x) => x.level >= 5}
];

/* ======================= Datos de ejemplo ======================= */
function lcg(seed){ let s = seed; return () => (s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296; }
function tk(title, cat, prio, min, day, done){
  return {id: uid(), title, cat, prio, min, day, done: !!done, doneAt: done ? day : null, xp: done ? taskXp(prio, min) : 0, carried: false};

function taskXp(prio, min){ return 10 + (prio === 'high' ? 10 : prio === 'med' ? 5 : 0) + (min >= 45 ? 5 : 0); }
function steps(list){ return list.map(([t, d]) => ({id: uid(), t, done: !!d})); }
function habit(name, pattern){
  const days = {};
  for (let i = 0; i < pattern.length; i++) if (pattern[i] === '1') days[keyOffset(i - (pattern.length - 1))] = true;
  return {id: uid(), name, days};
}

function seedProfile(mode){
  const stu = mode === 'student', t0 = keyOffset(0), t1 = keyOffset(1);

      tk('Resolver los ejercicios del tema 4 de Cálculo', 'study', 'high', 50, t0),

      tk('Repasar apuntes de Física en una página', 'study', 'med', 30, t0),
      tk('Responder el correo del tutor del TFG', 'study', 'low', 5, t0),
      tk('Leer el artículo del seminario', 'study', 'med', 25, t0, true),
      tk('Ir al gimnasio', 'personal', 'med', 45, t0, true),
      tk('Entregar la práctica de Programación', 'study', 'high', 90, t1),
      tk('Reservar sala de estudio para el viernes', 'study', 'low', 5, t1)
    );
    P.habits = [habit('Repaso activo de 30 min', '10111011110111'), habit('Beber 2 L de agua', '11111111111011'), habit('Dormir antes de las 23:30', '01101101110110'), habit('Leer 15 páginas', '00111111111111')];
    P.goals = [

function barChart(P){

  const bars = days.map((d, i) => {

      '<text class="ax' + (isT ? ' today' : '') + '" x="' + (x + bwid / 2).toFixed(1) + '" y="' + (H - 11) + '" text-anchor="middle">' + (isT ? 'hoy' : dowShort(d.k)) + '</text>';

function heatmap(P){

function parseCapture(raw){
  let text = ' ' + raw.trim() + ' ', prio = 'med', cat = db.mode === 'student' ? 'study' : 'work', min = 25, m;
  if ((m = text.match(/\s!(alta|media|baja)(?=\s)/i))){ prio = {alta: 'high', media: 'med', baja: 'low'}[m[1].toLowerCase()]; text = text.replace(m[0], ' '); }
  else if ((m = text.match(/\s!(?=\s)/))){ prio = 'high'; text = text.replace(m[0], ' '); }
  if ((m = text.match(/\s#(estudio|trabajo|personal)(?=\s)/i))){ cat = {estudio: 'study', trabajo: 'work', personal: 'personal'}[m[1].toLowerCase()]; text = text.replace(m[0], ' '); }
  if ((m = text.match(/\s(\d{1,3})\s?(min|m|h)(?=\s)/i))){ min = m[2].toLowerCase() === 'h' ? +m[1] * 60 : +m[1]; text = text.replace(m[0], ' '); }
  return {title: cap1(text.replace(/\s+/g, ' ').trim()), prio, cat, min: Math.min(Math.max(min, 1), 480)};
}

/* ======================= Acciones ======================= */
const ACT = {
  'toggle-task'(el){
    const P = S(), t = P.tasks.find(t => t.id === el.dataset.id); if (!t) return;
    if (!t.done){
      t.done = true; t.doneAt = keyOffset(0); t.xp = award(P, taskXp(t.prio, t.min)); toast('Tarea completada. +' + t.xp + ' XP', '', 'check'); burstFrom(el, 26);
      const left = P.tasks.filter(x => x.day === keyOffset(0) && !x.done).length;
      if (!left && t.day === keyOffset(0)){ setTimeout(() => { toast('Día completo. Has terminado todo lo de hoy', '', 'award'); burstFrom(null, 90); }, 450); }
    } else { t.done = false; t.doneAt = null; P.xp = Math.max(0, P.xp - (t.xp || 0)); t.xp = 0; }
    commit();
  },
  'del-task'(el){ const P = S(), t = P.tasks.find(t => t.id === el.dataset.id); if (t && t.done) P.xp = Math.max(0, P.xp - (t.xp || 0)); P.tasks = P.tasks.filter(t => t.id !== el.dataset.id); if (T.taskId === el.dataset.id) T.taskId = null; commit(); },
  'focus-task'(el){
    T.taskId = el.dataset.id;
    if (T.kind !== 'focus' || (T.started && !T.running)) setKind('focus'); else if (!T.running) resetTimer();
    if (!T.running && !T.started){ T.total = T.remain = kindSecs('focus'); startTimer(); }
    location.hash = '#enfoque'; if (UI.view === 'enfoque') commit();
    toast('A por ello: un bloque, una tarea', '', 'timer');
  },
  'set-day'(el){ UI.day = el.dataset.day; if (UI.view !== 'hoy') location.hash = '#hoy'; else { renderView(); if (el.dataset.day === 'tomorrow'){ const c = $('#cap'); if (c) c.focus(); } } },
  'quote'(){ UI.quoteShift++; renderView(); },
  'toggle-habit'(el){
    const P = S(), h = P.habits.find(h => h.id === el.dataset.id), k = el.dataset.date; if (!h) return;
    if (h.days[k]){ delete h.days[k]; P.xp = Math.max(0, P.xp - 5); } else { h.days[k] = true; award(P, 5); if (k === keyOffset(0)) burstFrom(el, 16); }
    commit();
  },
  'del-habit'(el){ const P = S(); P.habits = P.habits.filter(h => h.id !== el.dataset.id); commit(); },
  'toggle-step'(el){
    const P = S(), g = P.goals.find(g => g.id === el.dataset.id), s = g && g.steps.find(s => s.id === el.dataset.step); if (!s) return;
    s.done = !s.done; if (s.done){ award(P, 8); if (g.steps.every(x => x.done)){ toast('Meta cumplida: ' + g.title, '', 'award'); burstFrom(el, 80); } } else P.xp = Math.max(0, P.xp - 8);
    commit();
  },
  'del-goal'(el){ const P = S(); P.goals = P.goals.filter(g => g.id !== el.dataset.id); commit(); },
  'mode'(el){ if (db.mode === el.dataset.mode) return; db.mode = el.dataset.mode; T.taskId = null; UI.day = 'today'; commit(); toast('Perfil: ' + (db.mode === 'student' ? 'Estudiante' : 'Profesional'), '', 'spark'); },
  'theme'(){ const d = isDark(); db.theme = d ? 'light' : 'dark'; document.documentElement.dataset.theme = db.theme; save(); renderAll(); },
  'sound'(){ db.sound = !db.sound; save(); renderChrome(); if (db.sound) beep(); },
  'reset'(){ UI.confirmReset = true; renderChrome(); },
  'reset-no'(){ UI.confirmReset = false; renderChrome(); },
  'reset-yes'(){ const th = db.theme, snd = db.sound, mode = db.mode; db = seedDB(); db.theme = th; db.sound = snd; db.mode = mode; UI.confirmReset = false; T.taskId = null; commit(); toast('Demo reiniciada con datos de ejemplo', '', 'reset'); },
  'go-focus'(){ location.hash = '#enfoque'; },
  /* temporizador */
  't-toggle'(){ if (T.running) pauseTimer(); else startTimer(); paintTimer(); renderChrome(); },
  't-reset'(){ resetTimer(); renderChrome(); renderView(); },
  't-skip'(){ const to = T.kind === 'focus' ? ((T.cycle + 1) % 4 === 0 ? 'long' : 'short') : 'focus'; setKind(to); renderChrome(); renderView(); },
  't-kind'(el){ setKind(el.dataset.kind); renderChrome(); renderView(); },
  't-preset'(el){ T.preset = el.dataset.p; const wasRunning = T.running; if (!wasRunning){ T.total = T.remain = kindSecs(T.kind); T.started = false; } renderView(); },
  't-demo'(){ T.total = T.total || 60; finishTimer(); },
  't-done-task'(el){ const t = S().tasks.find(t => t.id === T.taskId); if (t){ ACT['toggle-task']({dataset: {id: t.id}, getBoundingClientRect: () => el.getBoundingClientRect()}); T.taskId = null; renderView(); } },
  'distract-toggle'(){ UI.distractOpen = !UI.distractOpen; renderView(); },
  'distract'(el){ S().distractions.push({id: uid(), date: keyOffset(0), cause: el.dataset.cause}); UI.distractOpen = false; toast('Anotado: ' + el.dataset.cause + '. Respira y retoma la tarea', '', 'alert'); commit(); },
  'ritual'(el){ const i = +el.dataset.i; UI.ritual[i] = !UI.ritual[i]; renderView(); if (UI.ritual.every(Boolean)) toast('Todo listo. Ahora, a por el bloque', '', 'bolt'); }
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && ACT[el.dataset.act]){ ACT[el.dataset.act](el); } });
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault();
  const P = S(), val = (f.elements.t.value || '').trim(); if (!val) return;
  const kind = f.dataset.form;
  if (kind === 'capture'){ const p = parseCapture(val); if (!p.title) return; P.tasks.push({id: uid(), title: p.title, cat: p.cat, prio: p.prio, min: p.min, day: UI.day === 'today' ? keyOffset(0) : keyOffset(1), done: false, doneAt: null, xp: 0, carried: false}); commit('cap'); toast('Tarea añadida' + (UI.day === 'tomorrow' ? ' para mañana' : ''), '', 'plus'); }
  else if (kind === 'habit'){ P.habits.push({id: uid(), name: cap1(val), days: {}}); commit('hab-in'); }
  else if (kind === 'goal'){ P.goals.unshift({id: uid(), title: cap1(val), cat: db.mode === 'student' ? 'study' : 'work', due: f.elements.due.value || keyOffset(30), steps: []}); commit('goal-in'); toast('Meta creada. Añade su primer paso', '', 'flag'); }
  else if (kind === 'step'){ const g = P.goals.find(g => g.id === f.dataset.id); if (g){ g.steps.push({id: uid(), t: cap1(val), done: false}); commit('st-' + g.id); } }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'intent'){ S().intention = {date: keyOffset(0), text: t.value.trim()}; save(); if (t.value.trim()) toast('Intención guardada', '', 'target'); }
  else if (t.id === 'name'){ S().name = t.value.trim() || (db.mode === 'student' ? 'Lucía' : 'Marcos'); save(); renderAll(); }
  else if (t.id === 't-task'){ T.taskId = t.value || null; renderView(); }
});
window.addEventListener('hashchange', route);
window.addEventListener('resize', () => { if (parts.length){ fx.width = innerWidth * (devicePixelRatio || 1); fx.height = innerHeight * (devicePixelRatio || 1); fctx.setTransform(devicePixelRatio || 1, 0, 0, devicePixelRatio || 1, 0, 0); } });

/* ======================= Arranque ======================= */
db = load() || seedDB();
rollover();
if (db.theme === 'light' || db.theme === 'dark') document.documentElement.dataset.theme = db.theme;
T.total = T.remain = kindSecs('focus');
route();
})();
</script>
